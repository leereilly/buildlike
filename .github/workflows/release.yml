name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cli/gh-extension-precompile@v2
        with:
          go_version_file: go.mod
          go_build_options: ./cmd/commit-crawl

      # cli/gh-extension-precompile auto-marks any tag containing `-` (e.g. v1.0.0-rc.1)
      # as a prerelease, which `gh extension install` then skips because it queries
      # /releases/latest (prereleases excluded). Flip it back so the release is installable.
      - name: Ensure release is installable via `gh extension install`
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --prerelease=false --repo "${GITHUB_REPOSITORY}"
