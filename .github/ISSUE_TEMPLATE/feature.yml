name: Feature request
description: Suggest an idea, easter egg, or polish item
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem or experience are you solving for?
      description: Tell us the story before the solution.
      placeholder: When I run commit-crawl in a screen recording I'd like it to…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see happen?
      placeholder: A new flag --foo that…
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've already considered or tried?
      description: Optional — workarounds, prior art, related projects.

  - type: checkboxes
    id: contribute
    attributes:
      label: Are you interested in contributing this?
      options:
        - label: I'd be happy to send a PR.
